	.nav { display: none; }

.seg { display: inline-flex; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 3px; }

.seg button[aria-selected="true"] { background: var(--bg); color: var(--ink); font-weight: 600; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; overflow-x: auto; }

<div id="app"></div>

<script>
// ---------------------------------------------------------------------------
// Sample data: same generator as src/lib/server/demo.ts (20 clients, 3-4 staff each)
// ---------------------------------------------------------------------------
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const DAY = 86400000;
const daysAgo = (n) => new Date(Date.now() - n * DAY);
const iso = (d) => d.toISOString();
const dayStr = (d) => d.toISOString().slice(0, 10);
const slugify = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
let uid = 0; const newId = () => 'id' + (++uid);

const SUPER = 'super-admin';
const CLIENTS = [
	['Acme Roofing', 'Roofing', 14, 1.0, 1, ['google', 'meta', 'google_ads', 'meta_ads']],
	['Bright Smile Dental', 'Dental', 6, 0.7, 1, ['google', 'meta', 'google_ads']],
	['Summit HVAC', 'HVAC', 9, 0.9, 1, ['google', 'google_ads']],
	['Harbor Law Group', 'Legal', 22, 0.5, 0.5, ['google', 'meta']],
	['Evergreen Landscaping', 'Landscaping', 5, 0.6, 1, ['google', 'meta', 'meta_ads']],
	['Peak Fitness Studio', 'Fitness', 1.2, 0.8, -1, ['google', 'meta', 'meta_ads']],
	['Coastal Realty', 'Real estate', 18, 1.3, 1, ['google', 'meta', 'google_ads', 'meta_ads']],
	['Blue Ridge Plumbing', 'Plumbing', 4, 0.8, 1, ['google', 'google_ads']],
	['Urban Bites Catering', 'Catering', 3, 0.4, 0.5, ['google', 'meta']],
	['Northside Auto Repair', 'Auto repair', 2, 0.6, -0.5, ['google']],
	['Lumen Med Spa', 'Med spa', 2.5, 0.7, 1, ['google', 'meta', 'meta_ads']],
	['Keystone Builders', 'Construction', 45, 0.4, 1, ['google', 'google_ads']],
	['Silver Oak Senior Living', 'Senior care', 30, 0.5, 0.5, ['google', 'meta']],
	['Prairie Solar', 'Solar', 26, 0.9, 1, ['google', 'meta', 'google_ads', 'meta_ads']],
	['Metro Pest Control', 'Pest control', 1.5, 0.7, 0.5, ['google', 'google_ads']],
	['Willow Veterinary', 'Veterinary', 1, 0.6, 1, ['google', 'meta']],
	['Titan Garage Doors', 'Garage doors', 3, 0.5, -1, ['google']],
	['Clearview Windows', 'Windows', 12, 0.8, 1, ['google', 'meta', 'meta_ads']],
	['Redline Moving Co.', 'Moving', 2.2, 0.6, 0.5, ['google', 'google_ads']],
	['Horizon Financial', 'Financial advice', 8, 0.5, 0, []]
];
const FIRST = ['Maria', 'James', 'Priya', 'Carlos', 'Aisha', 'Tom', 'Grace', 'Omar', 'Leah', 'Victor', 'Nina', 'Derek', 'Sofia', 'Ben', 'Hana', 'Luis', 'Zoe', 'Ravi', 'Emma', 'Jake'];
const LAST = ['Lopez', 'Carter', 'Shah', 'Nguyen', 'Brooks', 'Reed', 'Kim', 'Patel', 'Diaz', 'Hughes', 'Ward', 'Singh', 'Ellis', 'Moreno', 'Fox'];
const LEAD_NAMES = ['Robert Mills', 'Angela Brooks', 'Dave Kim', 'Linda Torres', 'Mark Ellison', 'Sofia Nguyen', 'Tom Becker', 'Rachel Green', 'Owen Patel', 'Carla Diaz', 'Ben Foster', 'Nina Hart', 'Greg Walsh', 'Emily Stone', 'Victor Reyes', 'Holly Price', 'Sam Ortiz', 'Julia Chen', 'Aaron Webb', 'Kate Lin', 'Paula Grant', 'Ian Brooks', 'Maya Cole', 'Eric Tran'];

const SOURCES = {
	ga4: { label: 'Website (Google Analytics)', provider: 'google' }, gsc: { label: 'Google Search', provider: 'google' },
	youtube: { label: 'YouTube', provider: 'google' }, facebook: { label: 'Facebook', provider: 'meta' },
	instagram: { label: 'Instagram', provider: 'meta' }, google_ads: { label: 'Google Ads', provider: 'google_ads' },
	meta_ads: { label: 'Meta Ads', provider: 'meta_ads' }
};
const METRICS = [
	{ source: 'ga4', metric: 'sessions', label: 'Website visits', agg: 'sum' },
	{ source: 'ga4', metric: 'totalUsers', label: 'Visitors', agg: 'sum' },
	{ source: 'ga4', metric: 'keyEvents', label: 'Conversions', agg: 'sum' },
	{ source: 'gsc', metric: 'clicks', label: 'Search clicks', agg: 'sum' },
	{ source: 'gsc', metric: 'impressions', label: 'Search impressions', agg: 'sum' },
	{ source: 'gsc', metric: 'position', label: 'Avg. search position', agg: 'avg', format: 'decimal', upIsGood: false },
	{ source: 'youtube', metric: 'views', label: 'Video views', agg: 'sum' },
	{ source: 'youtube', metric: 'estimatedMinutesWatched', label: 'Minutes watched', agg: 'sum' },
	{ source: 'youtube', metric: 'subscribersNet', label: 'Net subscribers', agg: 'sum' },
	{ source: 'facebook', metric: 'followers', label: 'Page followers', agg: 'last' },
	{ source: 'facebook', metric: 'page_post_engagements', label: 'Post engagements', agg: 'sum' },
	{ source: 'instagram', metric: 'followers', label: 'Followers', agg: 'last' },
	{ source: 'instagram', metric: 'reach', label: 'Accounts reached', agg: 'sum' },
	{ source: 'google_ads', metric: 'spend', label: 'Google Ads spend', agg: 'sum', format: 'money', neutral: true },
	{ source: 'google_ads', metric: 'clicks', label: 'Ad clicks', agg: 'sum' },
	{ source: 'google_ads', metric: 'conversions', label: 'Ad conversions', agg: 'sum' },
	{ source: 'meta_ads', metric: 'spend', label: 'Meta Ads spend', agg: 'sum', format: 'money', neutral: true },
	{ source: 'meta_ads', metric: 'clicks', label: 'Ad clicks', agg: 'sum' },
	{ source: 'meta_ads', metric: 'leads', label: 'Ad leads', agg: 'sum' }
];
const PROVIDERS = [
	{ id: 'google', name: 'Google', covers: 'Google Analytics 4, Search Console, YouTube', ads: false, available: true, pickers: ['Google Analytics property', 'Search Console site', 'YouTube channel'] },
	{ id: 'meta', name: 'Meta', covers: 'Facebook Page, Instagram Business', ads: false, available: true, pickers: ['Facebook Page (and linked Instagram)'] },
	{ id: 'google_ads', name: 'Google Ads', covers: 'Spend, clicks, conversions, cost per conversion', ads: true, available: true, pickers: ['Google Ads account'] },
	{ id: 'meta_ads', name: 'Meta Ads', covers: 'Facebook + Instagram ad spend, clicks, leads', ads: true, available: true, pickers: ['Ad account'] },
	{ id: 'tiktok_ads', name: 'TikTok Ads', covers: 'Spend, views, conversions', available: false },
	{ id: 'linkedin_ads', name: 'LinkedIn Ads', covers: 'Spend, leads, CPL', available: false },
	{ id: 'gbp', name: 'Google Business Profile', covers: 'Calls, direction requests, reviews', available: false },
	{ id: 'callrail', name: 'CallRail', covers: 'Tracked calls by source', available: false }
];
const STAGES = [['new', 'New lead'], ['attempted_contact', 'Attempted contact'], ['meeting_scheduled', 'Meeting scheduled'], ['proposal_sent', 'Proposal sent'], ['closed_won', 'Closed won'], ['closed_lost', 'Closed lost']];
const LEAD_SOURCES = [['door_knock', 'Door knock'], ['referral', 'Referral'], ['web', 'Web'], ['phone', 'Phone'], ['social', 'Social'], ['other', 'Other']];
const QUICK = [['call', 'Logged call'], ['voicemail', 'Left voicemail'], ['door_knock', 'Knocked door'], ['follow_up_scheduled', 'Scheduled follow-up']];
const ROLES = [['owner', 'Owner', 'Everything: dashboard, team, KPIs, connections, all leads'], ['rep', 'Sales rep', 'Pipeline, add leads, log activity on their own leads'], ['viewer', 'View only', 'Sees the dashboard, cannot change anything']];
const ROLE_LABEL = { agency: 'Super admin', owner: 'Owner', rep: 'Sales rep', viewer: 'View only' };

function seed() {
	const r = rng(42);
	const db = { profiles: [{ id: SUPER, name: 'You (CMO)', email: 'cmo@youragency.com', agency: true }], orgs: [], members: [], leads: [], activities: [], huddles: [], spend: [], integrations: [], snaps: [], kpis: [] };
	const monthStart = (back) => { const d = new Date(); return dayStr(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() - back, 1))); };
	CLIENTS.forEach(([name, industry, dealK, scale, momentum, providers], ci) => {
		const orgId = newId(); const slug = slugify(name);
		db.orgs.push({ id: orgId, name, slug, industry });
		const roles = ['owner', 'rep', 'rep', ...(ci % 3 === 0 ? [] : ['viewer'])];
		const staff = roles.map((role, i) => {
			const first = FIRST[(ci * 3 + i) % FIRST.length], last = LAST[(ci * 7 + i * 3) % LAST.length], id = newId();
			db.profiles.push({ id, name: `${first} ${last}`, email: `${first.toLowerCase()}@${slug}.com`, agency: false });
			db.members.push({ org: orgId, user: id, role });
			return { id, role };
		});
		const sellers = staff.filter((s) => s.role !== 'viewer');
		const bag = ['new', 'new', 'new', 'attempted_contact', 'attempted_contact', 'meeting_scheduled', 'meeting_scheduled', 'proposal_sent', 'proposal_sent', 'closed_won', 'closed_won', 'closed_lost', 'closed_lost'];
		const srcs = ['door_knock', 'referral', 'web', 'phone', 'social'];
		const n = 10 + Math.floor(r() * 14), leadIds = [];
		for (let i = 0; i < n; i++) {
			const stage = bag[Math.floor(r() * bag.length)], created = daysAgo(2 + Math.floor(r() * 80)), id = newId();
			leadIds.push(id);
			db.leads.push({ id, org: orgId, owner: sellers[i % sellers.length].id, name: LEAD_NAMES[(ci * 5 + i) % LEAD_NAMES.length],
				company: r() > 0.5 ? `${LAST[(ci + i) % LAST.length]} ${['Holdings', 'Residence', 'LLC', 'Group'][i % 4]}` : '',
				phone: `(555) ${String(100 + ci).slice(-3)}-${String(1000 + i * 37).slice(-4)}`, source: srcs[Math.floor(r() * srcs.length)], stage,
				value: Math.round(dealK * (0.5 + r()) * 1000), created: iso(created),
				changed: iso(daysAgo(stage.startsWith('closed') ? 2 + Math.floor(r() * 25) : Math.floor(r() * 6))) });
		}
		const types = ['call', 'call', 'voicemail', 'door_knock', 'follow_up_scheduled', 'email'];
		const na = 8 + Math.floor(r() * 30);
		for (let i = 0; i < na; i++) db.activities.push({ org: orgId, lead: leadIds[i % leadIds.length], user: sellers[Math.floor(r() * sellers.length)].id, type: types[i % types.length], at: iso(daysAgo(r() * 6.5)) });
		db.huddles.push({ id: newId(), org: orgId, date: dayStr(daysAgo(ci % 3)), wins: `Closed ${LEAD_NAMES[ci % LEAD_NAMES.length]} ($${Math.round(dealK * 1.1)}K). Two new referrals this week.`, blockers: ci % 2 ? 'Waiting on a financing approval for one proposal.' : '', focus: 'Follow up on every open proposal before Friday.' });
		for (const back of [0, 1, 2, 3]) db.spend.push({ id: newId(), org: orgId, channel: 'SEO retainer', month: monthStart(back), amount: Math.round(800 + dealK * 40) });
		const broken = name === 'Harbor Law Group';
		for (const p of providers) db.integrations.push({ org: orgId, provider: p, status: broken && p === 'meta' ? 'error' : 'connected', error: broken && p === 'meta' ? 'Access expired. Reconnect this account.' : '', synced: iso(daysAgo(broken && p === 'meta' ? 9 : 0.3)) });
		const has = (p) => providers.includes(p);
		const push = (source, metric, d, value) => db.snaps.push({ org: orgId, source, metric, day: dayStr(d), value });
		for (let i = 62; i >= 1; i--) {
			const d = daysAgo(i), growth = 1 + (62 - i) * 0.005 * momentum, wk = [0.7, 1.05, 1.1, 1.08, 1.02, 0.95, 0.75][d.getUTCDay()], nz = () => 0.88 + r() * 0.24;
			if (has('google')) {
				const s = Math.round(420 * scale * growth * wk * nz());
				push('ga4', 'sessions', d, s); push('ga4', 'totalUsers', d, Math.round(s * 0.72)); push('ga4', 'keyEvents', d, Math.round(s * 0.026 * nz()));
				const imp = Math.round(5200 * scale * growth * wk * nz());
				push('gsc', 'impressions', d, imp); push('gsc', 'clicks', d, Math.round(imp * 0.029 * nz())); push('gsc', 'position', d, +(14.2 - (62 - i) * 0.04 * momentum + r() * 0.6).toFixed(1));
				if (ci % 4 === 0) { const v = Math.round(310 * scale * growth * nz()); push('youtube', 'views', d, v); push('youtube', 'estimatedMinutesWatched', d, Math.round(v * 2.9 * nz())); push('youtube', 'subscribersNet', d, Math.round(1 + r() * 5)); }
			}
			if (has('meta') && !(broken && i < 9)) {

	return `<div class="spark" data-spark="${id}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)} daily trend"><path d="${d}" fill="none" stroke="var(--series-1)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><line class="cross" x1="0" x2="0" y1="0" y2="${H}" stroke="var(--ink-3)" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/></svg></div>`;

		${i ? `<div class="stack" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">${p.pickers.map((pk) => `<label><span class="label">${pk}</span><select class="input"><option>${esc(o.name)} (${pk.toLowerCase().includes('site') ? slugify(o.name).replace(/-/g, '') + '.com' : 'main'})</option><option>Don't track</option></select></label>`).join('')}</div>` : ''}</section>`; }).join('')}</div>
	<h2 style="font-size:16px;margin-top:32px">Coming soon</h2><div class="grid g2" style="margin-top:12px;max-width:760px">${PROVIDERS.filter((p) => !p.available).map((p) => `<div class="card row" style="padding:16px;justify-content:space-between;opacity:.7"><div><p style="font-weight:500">${p.name}</p><p class="small muted">${p.covers}</p></div><span class="pill">Soon</span></div>`).join('')}</div>`;

const app = document.getElementById('app');
function render() {
	sparks.length = 0;
	const banner = S.user ? `<div class="banner">Demo, sample data: signed in as <strong>${esc(me().name)}</strong>${isAgency() ? '' : ` (${ROLE_LABEL[roleIn(S.org)] ?? ''})`}<button data-act="switch">Switch user</button></div>` : '';
	let body;
	if (!S.user) body = viewPicker();
	else if (!S.org) body = viewPortfolio();
	else body = clientShell({ overview: viewOverview, pipeline: viewPipeline, add: viewAdd, huddle: viewHuddle, team: viewTeam, kpis: viewKpis, connections: viewConnections }[S.view]());
	app.innerHTML = banner + body;
	// Portfolio table vs cards
	app.querySelectorAll('.only-sm').forEach((el) => { el.style.display = matchMedia('(max-width: 700px)').matches ? '' : 'none'; });
}
function go(patch) { Object.assign(S, patch); render(); window.scrollTo(0, 0); }

app.addEventListener('click', (e) => {
	const t = e.target.closest('[data-act]'); if (!t) return;
	const { act, id, v } = t.dataset;
	if (act === 'signin') {
		const orgs = db.profiles.find((p) => p.id === id)?.agency ? null : t.dataset.org;
		return go({ user: id, org: orgs ?? null, view: 'overview', openLead: null, flash: null });
	}
	if (act === 'switch') return go({ user: null, org: null, personaQuery: '' });
	if (act === 'portfolio') return isAgency() ? go({ org: null, view: 'overview' }) : go({ org: null });
	if (act === 'open-org') return go({ org: id, view: 'overview', openLead: null });
	if (act === 'view') return go({ view: v, openLead: null, confirmRemove: null, flash: v === 'team' ? S.flash : null });
	if (act === 'filter') { S.filter = v; return render(); }
	if (act === 'toggle-add') { S.adding = !S.adding; render(); return document.getElementById('nc-name')?.focus(); }
	if (act === 'open-lead') { S.openLead = S.openLead === id ? null : id; return render(); }
	if (act === 'log') {
		const l = db.leads.find((x) => x.id === id);
		db.activities.push({ org: l.org, lead: id, user: S.user, type: v, at: iso(new Date()) });
		if (l.stage === 'new' && canEditLead(l)) { l.stage = 'attempted_contact'; l.changed = iso(new Date()); toast(`${t.dataset.l} ✓ Moved to Attempted contact`); }
		else toast(`${t.dataset.l} ✓`);
		return render();
	}
	if (act === 'ask-remove') { S.confirmRemove = id; return render(); }
	if (act === 'cancel-remove') { S.confirmRemove = null; return render(); }
	if (act === 'remove') {
		const o = curOrg();
		if (id === S.user) { S.confirmRemove = null; toast("You can't remove yourself"); return render(); }
		const owners = db.members.filter((m) => m.org === o.id && m.role === 'owner');
		if (owners.length === 1 && owners[0].user === id) { S.confirmRemove = null; toast('Every client needs at least one owner'); return render(); }
		db.members = db.members.filter((m) => !(m.org === o.id && m.user === id)); S.confirmRemove = null; toast('Removed'); return render();
	}
	if (act === 'connect') {
		const o = curOrg(), ex = db.integrations.find((i) => i.org === o.id && i.provider === v);
		if (ex) { ex.status = 'connected'; ex.error = ''; ex.synced = iso(new Date()); } else db.integrations.push({ org: o.id, provider: v, status: 'connected', error: '', synced: iso(new Date()) });
		toast(`In the live app this opens ${PROVIDERS.find((p) => p.id === v).name}'s sign-in. Marked connected for the demo.`); return render();
	}
	if (act === 'sync') { const i = db.integrations.find((x) => x.org === S.org && x.provider === v); i.synced = iso(new Date()); toast('Synced'); return render(); }
	if (act === 'disconnect') { db.integrations = db.integrations.filter((x) => !(x.org === S.org && x.provider === v)); toast('Disconnected. Past data is kept.'); return render(); }
});
app.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('tr[data-act]')) e.target.click(); });

app.addEventListener('input', (e) => {
	if (e.target.id === 'persona-q' || e.target.id === 'client-q') {
		const k = e.target.id === 'persona-q' ? 'personaQuery' : 'query', pos = e.target.selectionStart;
		S[k] = e.target.value; render(); const el = document.getElementById(e.target.id); el.focus(); el.setSelectionRange(pos, pos);
	}
});

app.addEventListener('change', (e) => {
	const el = e.target;
	if (el.dataset.move) { const l = db.leads.find((x) => x.id === el.dataset.move); l.stage = el.value; l.changed = iso(new Date()); db.activities.push({ org: l.org, lead: l.id, user: S.user, type: 'stage_change', at: iso(new Date()) }); toast(`Moved to ${STAGES.find((s) => s[0] === el.value)[1]}`); return render(); }
	if (el.dataset.role) {
		if (el.dataset.role === S.user && el.value !== 'owner') { toast("You can't demote yourself"); return render(); }
		db.members.find((m) => m.org === S.org && m.user === el.dataset.role).role = el.value; toast('Role updated'); return render();
	}
	if (el.dataset.kpi) {
		app.querySelector(`[data-target-wrap="${el.dataset.kpi}"]`).hidden = !el.checked;
		const n = app.querySelectorAll('[data-kpi]:checked').length, c = document.getElementById('kpi-count');
		c.textContent = `${n} of 6 selected`; c.className = `small ${n > 6 ? 'bad' : 'muted'}`;
	}
});

app.addEventListener('submit', (e) => {
	e.preventDefault();
	const f = e.target, o = curOrg(), val = (id) => document.getElementById(id)?.value.trim() ?? '';
	if (f.id === 'new-client') {
		const n = val('nc-name'), slug = slugify(n);
		if (slug.length < 2) return toast('Name is too short');
		if (db.orgs.some((x) => x.slug === slug)) return toast('That client already exists');
		const id = newId(); db.orgs.push({ id, name: n, slug, industry: val('nc-ind') });
		return go({ org: id, view: 'team', adding: false, flash: { newClient: true } });
	}
	if (f.id === 'add-lead') {
		const amount = Number(val('l-val').replace(/[$,]/g, '') || 0);
		if (!Number.isFinite(amount) || amount < 0) return toast('Deal value must be a positive number');
		db.leads.push({ id: newId(), org: o.id, owner: S.user, name: val('l-name'), phone: val('l-phone'), company: val('l-co'), source: f.querySelector('[name=l-src]:checked').value, stage: 'new', value: amount, created: iso(new Date()), changed: iso(new Date()) });
		toast(`Saved ${val('l-name')}`);
		if (e.submitter?.dataset.again) { f.reset(); return document.getElementById('l-name').focus(); }
		return go({ view: 'pipeline' });
	}
	if (f.id === 'huddle') {
		const w = val('h-w'), b = val('h-b'), fo = val('h-f');
		if (!w && !b && !fo) return toast('Write at least one line');
		db.huddles.push({ id: newId(), org: o.id, date: dayStr(new Date()), wins: w, blockers: b, focus: fo }); toast('Huddle posted'); return render();
	}
	if (f.id === 'invite') {
		const email = val('i-email').toLowerCase(), role = f.querySelector('[name=i-role]:checked').value;
		let p = db.profiles.find((x) => x.email === email);
		if (!p) { p = { id: newId(), name: val('i-name') || email.split('@')[0], email, agency: false }; db.profiles.push(p); }
		const ex = db.members.find((m) => m.org === o.id && m.user === p.id);
		if (ex) ex.role = role; else db.members.push({ org: o.id, user: p.id, role });
		S.flash = null; toast(`Invite sent to ${email}. You can now sign in as them from Switch user.`); return render();
	}
	if (f.id === 'kpis') {
		const boxes = [...app.querySelectorAll('[data-kpi]:checked')];
		if (boxes.length > 6) return toast('Pick at most 6 headline KPIs');
		for (const b of boxes) { const t = app.querySelector(`[data-target="${b.dataset.kpi}"]`).value.replace(/[$,]/g, '').trim(); if (t && (!Number.isFinite(Number(t)) || Number(t) < 0)) return toast('Goals must be positive numbers'); }
		db.kpis = db.kpis.filter((k) => k.org !== o.id);
		for (const b of boxes) { const [source, metric] = b.dataset.kpi.split(':'), t = app.querySelector(`[data-target="${b.dataset.kpi}"]`).value.replace(/[$,]/g, '').trim(); db.kpis.push({ org: o.id, source, metric, position: METRICS.findIndex((m) => m.source === source && m.metric === metric), target: t === '' ? null : Number(t) }); }
		toast(`Saved ${boxes.length} KPIs`); return render();
	}
});

// Drag and drop between pipeline stages (desktop)
app.addEventListener('dragstart', (e) => { const li = e.target.closest?.('[data-drag]'); if (li) { S.dragging = li.dataset.drag; e.dataTransfer.effectAllowed = 'move'; } });
app.addEventListener('dragover', (e) => { const col = e.target.closest?.('[data-drop]'); if (col && S.dragging) { e.preventDefault(); app.querySelectorAll('.col.drop').forEach((c) => c !== col && c.classList.remove('drop')); col.classList.add('drop'); } });
app.addEventListener('drop', (e) => {
	const col = e.target.closest?.('[data-drop]'); if (!col || !S.dragging) return; e.preventDefault();
	const l = db.leads.find((x) => x.id === S.dragging); S.dragging = null;
	if (!canEditLead(l)) { toast('Only the assigned rep or the owner can move this lead'); return render(); }
	if (l.stage !== col.dataset.drop) { l.stage = col.dataset.drop; l.changed = iso(new Date()); toast(`Moved to ${STAGES.find((s) => s[0] === l.stage)[1]}`); }
	render();
});
app.addEventListener('dragend', () => { S.dragging = null; app.querySelectorAll('.col.drop').forEach((c) => c.classList.remove('drop')); });

// Sparkline crosshair + tooltip
app.addEventListener('pointermove', (e) => {
	const wrap = e.target.closest?.('[data-spark]'); if (!wrap) return;
	const { points, format } = sparks[wrap.dataset.spark], svg = wrap.querySelector('svg'), rect = svg.getBoundingClientRect();
	const i = Math.max(0, Math.min(points.length - 1, Math.round(((e.clientX - rect.left) / rect.width) * (points.length - 1))));
	const x = (i / (points.length - 1)) * 200, line = svg.querySelector('.cross');
	line.setAttribute('x1', x); line.setAttribute('x2', x); line.setAttribute('visibility', 'visible');
	let tip = wrap.querySelector('.tip'); if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; wrap.append(tip); }
	tip.style.left = `${(x / 200) * 100}%`;
	tip.innerHTML = `<span class="faint">${new Date(points[i].day + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' })}</span> <strong>${fmt(points[i].value, format)}</strong>`;
});
app.addEventListener('pointerout', (e) => { const wrap = e.target.closest?.('[data-spark]'); if (wrap && !wrap.contains(e.relatedTarget)) { wrap.querySelector('.tip')?.remove(); wrap.querySelector('.cross')?.setAttribute('visibility', 'hidden'); } });
addEventListener('resize', () => app.querySelectorAll('.only-sm').forEach((el) => { el.style.display = matchMedia('(max-width: 700px)').matches ? '' : 'none'; }));

render();
</script>
