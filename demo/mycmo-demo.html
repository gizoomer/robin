<title>MYCMO Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
:root {
	--paper: #f4f5f7; --surface: #ffffff; --sunken: #eef0f3; --line: #e2e5ea; --line-2: #cbd1d9;
	--ink: #0d1b2a; --ink-2: #4a5566; --ink-3: #7d8898;
	--nav: #0d1b2a; --nav-2: #16263a; --nav-ink: #aab5c3; --nav-hi: #ffffff;
	--accent: #0b6b6b; --accent-2: #0e8585; --accent-soft: rgba(11, 107, 107, 0.09); --on-accent: #ffffff;
	--good: #1e7f4f; --good-soft: rgba(30, 127, 79, 0.1); --warn: #a86a12; --warn-soft: rgba(168, 106, 18, 0.1); --bad: #b33a35; --bad-soft: rgba(179, 58, 53, 0.09);
	--shadow: 0 1px 2px rgba(13, 27, 42, 0.04), 0 8px 24px rgba(13, 27, 42, 0.06);
	--serif: "Newsreader", "Iowan Old Style", Georgia, serif;
	--sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		color-scheme: dark;
		--paper: #0a1119; --surface: #101a25; --sunken: #0d1620; --line: #1f2c3b; --line-2: #2d3d50;
		--ink: #eef2f6; --ink-2: #a8b3c1; --ink-3: #6f7c8c;
		--nav: #060b11; --nav-2: #111b27; --nav-ink: #8d99a8; --nav-hi: #ffffff;
		--accent: #39aca6; --accent-2: #52c2bb; --accent-soft: rgba(57, 172, 166, 0.14); --on-accent: #06201f;
		--good: #4cc38a; --good-soft: rgba(76, 195, 138, 0.13); --warn: #e0a84a; --warn-soft: rgba(224, 168, 74, 0.13); --bad: #ee7a74; --bad-soft: rgba(238, 122, 116, 0.13);
		--shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
	}
}
:root[data-theme="dark"] {
	color-scheme: dark;
	--paper: #0a1119; --surface: #101a25; --sunken: #0d1620; --line: #1f2c3b; --line-2: #2d3d50;
	--ink: #eef2f6; --ink-2: #a8b3c1; --ink-3: #6f7c8c;
	--nav: #060b11; --nav-2: #111b27; --nav-ink: #8d99a8; --nav-hi: #ffffff;
	--accent: #39aca6; --accent-2: #52c2bb; --accent-soft: rgba(57, 172, 166, 0.14); --on-accent: #06201f;
	--good: #4cc38a; --good-soft: rgba(76, 195, 138, 0.13); --warn: #e0a84a; --warn-soft: rgba(224, 168, 74, 0.13); --bad: #ee7a74; --bad-soft: rgba(238, 122, 116, 0.13);
	--shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); } .xs { font-size: 12px; } .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); }
.serif { font-family: var(--serif); font-weight: 500; letter-spacing: -0.01em; }
.plain { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Shell */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--nav); color: var(--nav-ink); padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.wordmark { display: flex; align-items: baseline; gap: 8px; padding: 4px 10px 22px; color: var(--nav-hi); }
.wordmark b { font-family: var(--serif); font-size: 22px; font-weight: 600; letter-spacing: 0.01em; }
.wordmark span { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--nav-ink); }
.side .grp { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--nav-ink); opacity: 0.7; padding: 16px 10px 6px; }
.side button.nv { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 10px; border: 0; background: none; color: var(--nav-ink); border-radius: 6px; text-align: left; font-size: 14px; }
.side button.nv:hover { background: var(--nav-2); color: var(--nav-hi); }
.side button.nv[aria-current="page"] { background: var(--nav-2); color: var(--nav-hi); box-shadow: inset 2px 0 0 var(--accent-2); }
.side button.nv .ct { margin-left: auto; font-size: 11px; opacity: 0.7; }
.side svg { width: 16px; height: 16px; flex: none; }
.side .pinned-link { font-size: 13px; min-height: 34px; }
.side .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.side .foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid var(--nav-2); font-size: 12px; }
.side .foot b { color: var(--nav-hi); font-weight: 600; display: block; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar .in { display: flex; align-items: center; gap: 12px; min-height: 60px; padding-inline: 32px; }
.demo-note { font-size: 12px; color: var(--ink-2); margin-left: auto; white-space: nowrap; }
.demo-note button { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 4px 12px; margin-left: 8px; font-size: 12px; font-weight: 600; }
.content { padding: 32px 32px 64px; max-width: 1320px; width: 100%; }
.menu-btn { display: none; border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; width: 40px; height: 40px; }

/* Search */
.search { position: relative; flex: 1; max-width: 460px; }
.search input { width: 100%; height: 40px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 0 12px 0 36px; font-size: 14px; }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search > svg { position: absolute; left: 12px; top: 12px; width: 16px; height: 16px; color: var(--ink-3); }
.search kbd { position: absolute; right: 10px; top: 10px; font: 11px var(--sans); color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 5px; }
.results { position: absolute; top: 46px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; max-height: 420px; overflow-y: auto; z-index: 40; }
.results li { display: flex; align-items: center; gap: 10px; border-radius: 6px; padding: 4px 4px 4px 10px; }
.results li[aria-selected="true"], .results li:hover { background: var(--sunken); }
.results .open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; min-height: 40px; padding: 0; }
.results .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pinbtn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pinbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

/* Page header */
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
.ph h1 { font-family: var(--serif); font-weight: 500; font-size: 34px; line-height: 1.1; letter-spacing: -0.015em; }
.ph .sub { margin-top: 6px; color: var(--ink-2); }
.crumbs { font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
.crumbs button { border: 0; background: none; padding: 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }

/* Surfaces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 18px 20px 0; flex-wrap: wrap; }
.panel-h h2 { font-size: 15px; font-weight: 600; }
.panel-b { padding: 16px 20px 20px; }
.sec { margin-top: 36px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.sec-h h2 { font-family: var(--serif); font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }

/* KPI strip: numbers separated by hairlines, the consulting-report way */
.strip { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.strip > div { padding: 20px 22px; border-left: 1px solid var(--line); min-width: 0; }
.strip > div:first-child { border-left: 0; }
.strip .lbl { font-size: 12px; color: var(--ink-2); }
.strip .val { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin-top: 6px; line-height: 1.1; }
.strip .dl { font-size: 12px; margin-top: 6px; color: var(--ink-3); }
.hero-val { font-size: clamp(28px, 2.6vw, 38px) !important; white-space: nowrap; }
.split { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.split-team { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 20px; align-items: start; }
@media (max-width: 960px) { .split, .split-team { grid-template-columns: 1fr; } }

.delta { font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { color: var(--good); background: var(--good-soft); } .chip.risk { color: var(--warn); background: var(--warn-soft); } .chip.act { color: var(--bad); background: var(--bad-soft); }
.chip.plain::before { display: none; }
.chip.role { color: var(--ink-2); background: var(--sunken); }
.chip.ads { color: var(--accent); background: var(--accent-soft); }

.meter { height: 6px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
.meter > div { height: 100%; border-radius: 999px; }
.f-ok { background: var(--good); } .f-mid { background: var(--accent); } .f-bad { background: var(--bad); }

/* Status distribution */
.dist { display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--surface); }
.dist > div { height: 100%; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* Pinned client cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.ccard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; transition: border-color 0.15s, box-shadow 0.15s; }
.ccard:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.ccard .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.ccard .nm { font-family: var(--serif); font-size: 19px; font-weight: 500; letter-spacing: -0.01em; border: 0; background: none; padding: 0; text-align: left; }
.ccard .nm:hover { color: var(--accent); }
.mini { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mini p:first-child { font-size: 11px; color: var(--ink-3); }
.mini p:last-child { font-size: 16px; font-weight: 600; margin-top: 2px; }
.ccard .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 13px; }
.iconbtn { border: 0; background: none; color: var(--ink-3); padding: 4px; border-radius: 6px; }
.iconbtn:hover { color: var(--ink); background: var(--sunken); }
.addcard { border: 1px dashed var(--line-2); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; color: var(--ink-2); background: transparent; min-height: 220px; }
.addcard:hover { border-color: var(--accent); color: var(--accent); }

/* Charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; touch-action: pan-y; }
.chart .axis { font-size: 11px; fill: var(--ink-3); font-family: var(--sans); }
.tip { position: absolute; top: 0; transform: translate(-50%, -110%); background: var(--ink); color: var(--paper); border-radius: 6px; padding: 5px 10px; font-size: 12px; white-space: nowrap; pointer-events: none; }
.spark svg { height: 36px; }

/* Tables */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; }
th button[aria-sort] { color: var(--ink); }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--sunken); }
td.num, th.num { text-align: right; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 8px; font-size: 14px; font-weight: 600; border: 1px solid var(--line-2); background: var(--surface); white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-2); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 12px; }
.btn.danger { color: var(--bad); }
.input { width: 100%; min-height: 42px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 0 12px; font-size: 15px; }
textarea.input { padding: 10px 12px; min-height: 70px; resize: vertical; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
select.input { padding-right: 28px; }
.label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 5px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--paper); font-weight: 600; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 28px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-size: 14px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-current="page"] { color: var(--ink); font-weight: 600; border-color: var(--accent); }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }

/* Summary callout */
.brief { border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 12px 12px 0; padding: 18px 22px; border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.brief p.t { font-family: var(--serif); font-size: 19px; line-height: 1.45; letter-spacing: -0.005em; max-width: 68ch; }

/* Pipeline */
.board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x mandatory; }
.col { flex: 0 0 min(84vw, 280px); scroll-snap-align: start; background: var(--sunken); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; }
.col.drop { border-color: var(--accent); background: var(--accent-soft); }
.col header { padding: 14px 14px 10px; }
.col ul { list-style: none; margin: 0; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; min-height: 80px; }
.lead { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.lead > button { all: unset; display: block; width: 100%; cursor: pointer; }
.lead .acts { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

/* Team hierarchy */
.tier { border-left: 2px solid var(--line-2); margin-left: 8px; padding-left: 18px; }
.tier + .tier { margin-top: 18px; }
.person { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--sunken); color: var(--ink-2); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
.radio-card { display: flex; gap: 10px; border: 1px solid var(--line-2); border-radius: 8px; padding: 10px; cursor: pointer; }
.radio-card:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.src-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.src-grid label { display: flex; align-items: center; justify-content: center; min-height: 42px; border: 1px solid var(--line-2); border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--surface); }
.src-grid label:has(input:checked) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.check { display: flex; align-items: center; gap: 12px; min-height: 42px; flex: 1; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 8px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.notice { border-radius: 10px; padding: 12px 16px; font-size: 14px; background: var(--accent-soft); }

/* Sign-in */
.signin { max-width: 880px; margin: 0 auto; padding: 56px 16px 64px; }
.signin h1 { font-family: var(--serif); font-weight: 500; font-size: 40px; letter-spacing: -0.02em; line-height: 1.1; }
.super-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; text-align: left; background: var(--nav); color: var(--nav-hi); border: 0; border-radius: 14px; padding: 22px 24px; margin-top: 28px; }
.super-card small { display: block; color: var(--nav-ink); font-size: 13px; margin-top: 4px; }
.persona { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; min-height: 40px; border: 0; background: none; border-radius: 6px; padding: 0 8px; text-align: left; }
.persona:hover { background: var(--sunken); }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 14px; }

.mobile-only { display: none; }
@media (max-width: 960px) {
	.shell { grid-template-columns: 1fr; }
	.side { position: fixed; inset: 0 auto 0 0; width: 272px; z-index: 50; transform: translateX(-100%); transition: transform 0.2s; }
	.shell.nav-open .side { transform: none; box-shadow: var(--shadow); }
	.menu-btn { display: inline-grid; place-items: center; }
	.topbar .in, .content { padding-inline: 16px; }
	.strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
	.strip > div { border-left: 0; border-top: 1px solid var(--line); }
	.strip > div:nth-child(-n+2) { border-top: 0; }
	.strip > div:nth-child(even) { border-left: 1px solid var(--line); }
	.demo-note .who { display: none; }
	.hide-md { display: none !important; }
	.mobile-only { display: block; }
}
@media (max-width: 560px) {
	.ph h1 { font-size: 28px; }
	.hero-val { font-size: 34px !important; }
	.strip .val { font-size: 22px; }
	.mini { grid-template-columns: repeat(3, minmax(0, 1fr)); }
	.search kbd { display: none; }
}
.scrim { display: none; }
@media (max-width: 960px) { .shell.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); z-index: 45; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app"></div>

<script>
// ===========================================================================

// ===========================================================================
// Charts (single series, one axis, hover crosshair + tooltip)
// ===========================================================================
const charts = [];
function areaChart(points, { height = 220, format, label }) {
	if (points.length < 2) return '';
	const id = charts.push({ points, format, kind: 'area', height }) - 1, W = 800, H = height, pl = 44, pr = 8, pt = 12, pb = 26;
	const vals = points.map((p) => p.value), max = Math.max(...vals) * 1.08, min = 0;
	const x = (i) => pl + (i / (points.length - 1)) * (W - pl - pr), y = (v) => pt + (1 - (v - min) / (max - min)) * (H - pt - pb);
	const line = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join('');
	const area = `${line}L${x(points.length - 1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z`;
	const ticks = [0, max / 2, max].map((v) => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text class="axis" x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v, format)}</text>`).join('');
	const xl = [0, Math.floor((points.length - 1) / 2), points.length - 1].map((i, k) => `<text class="axis" x="${x(i)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === 2 ? 'end' : 'middle'}">${shortDate(points[i].day)}</text>`).join('');
	const last = points.length - 1;
	return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" style="height:${H}px" role="img" aria-label="${esc(label)}, last 30 days">${ticks}${xl}<path d="${area}" fill="var(--accent)" opacity="0.1"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${x(last)}" cy="${y(points[last].value)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><line class="cross" y1="${pt}" y2="${H - pb}" stroke="var(--ink-3)" stroke-width="1" visibility="hidden"/><circle class="dot" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/></svg></div>`;
}
function spark(points, { format, label, height = 36 } = {}) {
	if (points.length < 2) return '';
	const id = charts.push({ points, format, kind: 'spark', height }) - 1, W = 200, H = height;
	const vals = points.map((p) => p.value), min = Math.min(...vals), max = Math.max(...vals);
	const x = (i) => (i / (points.length - 1)) * W, y = (v) => max === min ? H / 2 : H - 3 - ((v - min) / (max - min)) * (H - 6);
	const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join('');
	return `<div class="chart spark" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px" role="img" aria-label="${esc(label)} daily trend"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.75" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><line class="cross" y1="0" y2="${H}" stroke="var(--ink-3)" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/></svg></div>`;
}

function portfolioTotals() {
	const all = db.orgs.map(summary), sum = (f) => all.reduce((a, s) => a + f(s), 0);
	const counts = { ok: all.filter((s) => s.status === 'ok').length, risk: all.filter((s) => s.status === 'risk').length, act: all.filter((s) => s.status === 'act').length };
	const withAtt = all.filter((s) => s.att != null);
	// Portfolio-wide daily website visits
	const byDay = new Map(), prevTotal = { cur: 0, prev: 0 };
	for (const s of all) for (const t of s.tiles.ga4.filter((t) => t.def.metric === 'sessions')) { for (const p of t.spark) byDay.set(p.day, (byDay.get(p.day) ?? 0) + p.value); prevTotal.cur += t.value; prevTotal.prev += t.prior ?? 0; }
	const visits = [...byDay.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([day, value]) => ({ day, value }));
	return { all, counts, pipeline: sum((s) => s.open), won: sum((s) => s.won30), ad: sum((s) => s.adSpend), users: sum((s) => s.users), leads: sum((s) => s.newLeads), att: withAtt.length ? withAtt.reduce((a, s) => a + Math.min(s.att, 1.5), 0) / withAtt.length : null, visits, visitsTotal: prevTotal.cur, visitsDelta: prevTotal.prev ? (prevTotal.cur - prevTotal.prev) / prevTotal.prev : null };
}

function executiveBrief(o, s, goals, ps) {
	const parts = [];
	if (s.sDelta != null) parts.push(`Website visits are ${s.sDelta >= 0 ? 'up' : 'down'} ${Math.abs(Math.round(s.sDelta * 100))}% on the prior 30 days`);
	const withT = goals.filter((g) => g.pct != null), hit = withT.filter((g) => g.pct >= 1).length;
	if (withT.length) parts.push(`${hit} of ${withT.length} headline KPIs are at or above goal`);
	if (ps.openCount) parts.push(`${ps.openCount} open deals are worth ${money(ps.openValue)}`);
	let text = parts.length ? parts.join('; ') + '.' : 'No marketing data yet. Connect accounts to start reporting.';
	const behind = withT.filter((g) => g.pct < 0.8).sort((a, b) => a.pct - b.pct)[0];
	if (behind) text += ` ${kpiLabel(behind.def)} is the one to watch, at ${pct(behind.pct)} of goal.`;
	if (s.issues.some((i) => i.includes('reconnect'))) text += ` ${s.issues.find((i) => i.includes('reconnect'))}.`;
	return text;
}

	const key = (s, m) => `${s}:${m}`, sel = new Map(chosen.map((k) => [key(k.source, k.metric), k]));
	return `<p class="muted" style="max-width:68ch">Choose up to 6 headline KPIs for ${esc(o.name)} and set a monthly goal for each. They lead the client's dashboard and roll up into your portfolio view.</p>
	<form id="kpis" class="stack" style="margin-top:18px;gap:14px;max-width:880px">${Object.keys(SOURCES).map((k) => { const on = connected.includes(SOURCES[k].provider); return `<section class="panel" style="padding:16px 20px;${on ? '' : 'opacity:.62'}"><p style="font-weight:600">${SOURCES[k].label} <span class="xs faint" style="font-weight:400">${SOURCES[k].sub}${on ? '' : ' · not connected yet'}</span></p><ul class="plain" style="margin-top:6px">${METRICS.filter((m) => m.source === k).map((m) => { const kk = key(k, m.metric), cur = sel.get(kk); return `<li class="row" style="border-top:1px solid var(--line);padding-block:4px"><label class="check"><input type="checkbox" data-kpi="${kk}" ${cur ? 'checked' : ''}><span>${esc(m.label)}</span></label><label class="row xs muted" style="gap:8px" ${cur ? '' : 'hidden'} data-target-wrap="${kk}">${m.upIsGood === false ? 'Goal (at or below)' : 'Monthly goal'}<input class="input" style="width:128px;min-height:36px" inputmode="decimal" placeholder="Optional" data-target="${kk}" value="${cur?.target ?? ''}"></label></li>`; }).join('')}</ul></section>`; }).join('')}
	<div class="panel row" style="position:sticky;bottom:12px;padding:12px 16px;box-shadow:var(--shadow)"><span class="xs muted" id="kpi-count">${chosen.length} of 6 selected</span><button class="btn primary" style="margin-left:auto">Save KPIs and goals</button></div></form>`;
}

function viewConnections() {
	const o = curOrg(), integ = Object.fromEntries(db.integrations.filter((i) => i.org === o.id).map((i) => [i.provider, i]));
	return `<p class="muted" style="max-width:68ch">Each platform connects separately, so a client can share ad accounts without sharing analytics. Data refreshes nightly.</p>
	<div class="stack" style="margin-top:18px;gap:14px;max-width:880px">${PROVIDERS.filter((p) => p.available).map((p) => { const i = integ[p.id]; return `<section class="panel" style="padding:18px 20px"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><p style="font-weight:600;font-size:15px">${p.name} ${p.ads ? '<span class="chip ads plain" style="margin-left:4px">Ads</span>' : ''}</p><p class="muted xs">${p.covers}</p>${i ? `<p class="xs ${i.status === 'error' ? 'bad' : 'good'}" style="margin-top:6px;font-weight:600">${i.status === 'error' ? 'Needs reconnecting' : 'Connected'} <span class="faint" style="font-weight:400">· last sync ${new Date(i.synced).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</span></p>${i.error ? `<p class="xs muted">${esc(i.error)}</p>` : ''}` : ''}</div>
		<div class="row" style="gap:8px"><button class="btn ${i ? '' : 'primary'}" data-act="connect" data-v="${p.id}">${i ? 'Reconnect' : 'Connect'}</button>${i ? `<button class="btn" data-act="sync" data-v="${p.id}">Sync now</button><button class="btn danger" data-act="disconnect" data-v="${p.id}">Disconnect</button>` : ''}</div></div>
		${i ? `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)">${p.pickers.map((pk) => `<label><span class="label">${pk}</span><select class="input" style="font-size:14px"><option>${esc(o.name)}${pk.includes('site') ? ` (${slugify(o.name).replace(/-/g, '')}.com)` : ''}</option><option>Don't track</option></select></label>`).join('')}</div>` : ''}</section>`; }).join('')}
	<p class="eyebrow" style="margin-top:18px">Coming soon</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px">${PROVIDERS.filter((p) => !p.available).map((p) => `<div class="panel" style="padding:14px 16px;opacity:.72"><p style="font-weight:600">${p.name}</p><p class="xs muted">${p.covers}</p></div>`).join('')}</div></div>`;
}

// ===========================================================================
// Render + events
// ===========================================================================
const app = document.getElementById('app');
function render() {
	charts.length = 0;
	if (!S.user) { app.innerHTML = viewSignIn(); return; }
	let body;
	if (S.page === 'client' && S.org) body = clientHeader() + ({ overview: viewOverview, pipeline: viewPipeline, add: viewAdd, huddle: viewHuddle, team: viewTeam, kpis: viewKpis, connections: viewConnections }[S.tab])();
	else if (S.page === 'directory') body = viewDirectory();
	else if (S.page === 'new') body = viewNewClient();
	else body = viewHome();
	app.innerHTML = shell(body);
	renderSearch();
}
function renderSearch() { const w = document.getElementById('gresults-wrap'); if (w) w.innerHTML = searchResults(); }
function go(patch) { Object.assign(S, { navOpen: false, searchOpen: false, openLead: null, confirmRemove: null }, patch); render(); scrollTo(0, 0); }
function openOrg(id) { go({ page: 'client', org: id, tab: 'overview', searchQ: '', newClient: false }); }
function keepFocus(id, fn) { const el = document.getElementById(id), pos = el?.selectionStart; fn(); const n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch {} } }

app.addEventListener('click', (e) => {
	const t = e.target.closest('[data-act]');
	if (!e.target.closest('#gsearch') && S.searchOpen) { S.searchOpen = false; renderSearch(); }
	if (!t) return;
	const { act, id, v } = t.dataset;
	switch (act) {
		case 'signin': {
			S.user = id;
			if (id === SUPER) { S.pins = loadPins() ?? defaultPins(); return go({ page: 'home', org: null }); }
			const orgs = myOrgs();
			return go({ page: 'client', org: t.dataset.org ?? orgs[0].id, tab: 'overview' });
		}
		case 'switch': return go({ user: null, page: 'home', org: null, personaQ: '' });
		case 'page': return go({ page: v, org: v === 'client' ? S.org : null, newClient: false });
		case 'open-org': e.stopPropagation(); return openOrg(id);
		case 'tab': return go({ tab: v, newClient: v === 'team' ? S.newClient : false });
		case 'pin': {
			e.stopPropagation(); togglePin(id);
			// Re-render the page (sidebar and My view change) but keep the search dropdown open.
			if (S.searchOpen) return keepFocus('gsearch-in', render);
			return render();
		}
		case 'focus-search': { const i = document.getElementById('gsearch-in'); S.searchOpen = true; renderSearch(); i?.focus(); i?.scrollIntoView({ block: 'center' }); return; }
		case 'open-nav': S.navOpen = true; return render();
		case 'close-nav': S.navOpen = false; return render();
		case 'dir-filter': S.dir.status = v; S.dir.page = 0; return go({ page: 'directory' });
		case 'dir-page': S.dir.page += Number(v); return render();
		case 'sort': S.dir.asc = S.dir.sort === v ? !S.dir.asc : v === 'name'; S.dir.sort = v; return render();
		case 'open-lead': S.openLead = S.openLead === id ? null : id; return render();
		case 'log': {
			const l = db.leads.find((x) => x.id === id);
			db.activities.push({ org: l.org, lead: id, user: S.user, type: v, at: iso(new Date()) });
			if (l.stage === 'new' && canEditLead(l)) { l.stage = 'attempted_contact'; l.changed = iso(new Date()); toast(`${t.dataset.l}. Moved to Attempted contact.`); } else toast(`${t.dataset.l}. Logged.`);
			invalidate(l.org); return render();
		}
		case 'ask-remove': S.confirmRemove = id; return render();
		case 'cancel-remove': S.confirmRemove = null; return render();
		case 'remove': {
			const o = curOrg(); S.confirmRemove = null;
			if (id === S.user) { toast("You can't remove yourself"); return render(); }
			const admins = db.members.filter((m) => m.org === o.id && m.role === 'admin');
			if (admins.length === 1 && admins[0].user === id) { toast('Every client needs at least one admin'); return render(); }
			db.members = db.members.filter((m) => !(m.org === o.id && m.user === id)); invalidate(o.id); toast('Access removed'); return render();
		}
		case 'connect': {
			const ex = db.integrations.find((i) => i.org === S.org && i.provider === v);
			if (ex) Object.assign(ex, { status: 'connected', error: '', synced: iso(new Date()) }); else db.integrations.push({ org: S.org, provider: v, status: 'connected', error: '', synced: iso(new Date()) });
			invalidate(S.org); toast(`In the live app this opens ${PROVIDERS.find((p) => p.id === v).name}'s sign-in. Marked connected for the demo.`); return render();
		}
		case 'sync': db.integrations.find((x) => x.org === S.org && x.provider === v).synced = iso(new Date()); toast('Sync complete'); return render();
		case 'disconnect': db.integrations = db.integrations.filter((x) => !(x.org === S.org && x.provider === v)); invalidate(S.org); toast('Disconnected. Historical data is kept.'); return render();
	}
});
app.addEventListener('keydown', (e) => {
	if (e.key === 'Enter' && e.target.matches('tr[data-act]')) return openOrg(e.target.dataset.id);
	if (e.target.id === 'gsearch-in') {
		const items = [...document.querySelectorAll('#gresults li[data-id]')];
		if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); S.searchIdx = Math.max(0, Math.min(items.length - 1, S.searchIdx + (e.key === 'ArrowDown' ? 1 : -1))); renderSearch(); }
		if (e.key === 'Enter' && items[S.searchIdx]) { e.preventDefault(); openOrg(items[S.searchIdx].dataset.id); }
		if (e.key === 'Escape') { S.searchOpen = false; renderSearch(); e.target.blur(); }
	}
});
document.addEventListener('keydown', (e) => { if (e.key === '/' && S.user && isSuper() && !e.target.matches('input, textarea, select')) { e.preventDefault(); const i = document.getElementById('gsearch-in'); S.searchOpen = true; renderSearch(); i?.focus(); } });
app.addEventListener('focusin', (e) => { if (e.target.id === 'gsearch-in' && !S.searchOpen) { S.searchOpen = true; S.searchIdx = 0; renderSearch(); } });
app.addEventListener('input', (e) => {
	const el = e.target;
	if (el.id === 'gsearch-in') { S.searchQ = el.value; S.searchOpen = true; S.searchIdx = 0; return renderSearch(); }
	if (el.id === 'persona-q') { S.personaQ = el.value; return keepFocus('persona-q', render); }
	if (el.id === 'dir-q') { S.dir.q = el.value; S.dir.page = 0; return keepFocus('dir-q', render); }
});
app.addEventListener('change', (e) => {
	const el = e.target;
	if (el.id === 'dir-ind') { S.dir.industry = el.value; S.dir.page = 0; return render(); }
	if (el.dataset.move) { const l = db.leads.find((x) => x.id === el.dataset.move); l.stage = el.value; l.changed = iso(new Date()); invalidate(l.org); toast(`Moved to ${STAGES.find((s) => s[0] === el.value)[1]}`); return render(); }
	if (el.dataset.role) {
		if (el.dataset.role === S.user && el.value !== 'admin') { toast("You can't lower your own access"); return render(); }
		const admins = db.members.filter((m) => m.org === S.org && m.role === 'admin');
		if (el.value !== 'admin' && admins.length === 1 && admins[0].user === el.dataset.role) { toast('Every client needs at least one admin'); return render(); }
		db.members.find((m) => m.org === S.org && m.user === el.dataset.role).role = el.value; toast('Access level updated'); return render();
	}
	if (el.dataset.kpi) {
		app.querySelector(`[data-target-wrap="${el.dataset.kpi}"]`).hidden = !el.checked;
		const n = app.querySelectorAll('[data-kpi]:checked').length, c = document.getElementById('kpi-count'); c.textContent = `${n} of 6 selected`; c.className = `xs ${n > 6 ? 'bad' : 'muted'}`;
	}
});
app.addEventListener('submit', (e) => {
	e.preventDefault();
	const f = e.target, o = curOrg(), val = (id) => document.getElementById(id)?.value.trim() ?? '';
	if (f.id === 'new-client') {
		const n = val('nc-name'), slug = slugify(n);
		if (slug.length < 2) return toast('Enter the business name');
		if (db.orgs.some((x) => x.slug === slug)) return toast('A client with that name already exists');
		const id = newId(); db.orgs.push({ id, name: n, slug, industry: val('nc-ind') || 'Other', since: iso(new Date()) }); db.snaps.set(id, []);
		if (document.getElementById('nc-pin').checked) { S.pins = [...S.pins, id]; savePins(); }
		toast(`${n} created`); return go({ page: 'client', org: id, tab: 'team', newClient: true });
	}
	if (f.id === 'add-lead') {
		const amount = Number(val('l-val').replace(/[$,]/g, '') || 0);
		if (!Number.isFinite(amount) || amount < 0) return toast('Deal value must be a positive number');
		db.leads.push({ id: newId(), org: o.id, owner: isSuper() ? null : S.user, name: val('l-name'), phone: val('l-phone'), company: val('l-co'), source: f.querySelector('[name=l-src]:checked').value, stage: 'new', value: amount, created: iso(new Date()), changed: iso(new Date()) });
		invalidate(o.id); toast(`Saved ${val('l-name')}`);
		if (e.submitter?.dataset.again) { f.reset(); return document.getElementById('l-name').focus(); }
		return go({ tab: 'pipeline' });
	}
	if (f.id === 'huddle') {
		const w = val('h-w'), b = val('h-b'), fo = val('h-f');
		if (!w && !b && !fo) return toast('Write at least one line');
		db.huddles.push({ id: newId(), org: o.id, date: dayStr(new Date()), wins: w, blockers: b, focus: fo }); toast('Huddle posted'); return render();
	}
	if (f.id === 'invite') {
		const email = val('i-email').toLowerCase(), role = f.querySelector('[name=i-role]:checked').value;
		let p = db.profiles.find((x) => x.email === email);
		if (!p) { p = { id: newId(), name: val('i-name') || email.split('@')[0], email }; db.profiles.push(p); }
		const ex = db.members.find((m) => m.org === o.id && m.user === p.id);
		if (ex) ex.role = role; else db.members.push({ org: o.id, user: p.id, role, added: iso(new Date()) });
		invalidate(o.id); S.newClient = false; toast(`Invite sent to ${email}. Use Switch user to sign in as them.`); return render();
	}
	if (f.id === 'kpis') {
		const boxes = [...app.querySelectorAll('[data-kpi]:checked')];
		if (boxes.length > 6) return toast('Choose at most 6 headline KPIs');
		const tv = (b) => app.querySelector(`[data-target="${b.dataset.kpi}"]`).value.replace(/[$,]/g, '').trim();
		if (boxes.some((b) => tv(b) && (!Number.isFinite(Number(tv(b))) || Number(tv(b)) < 0))) return toast('Goals must be positive numbers');
		db.kpis = db.kpis.filter((k) => k.org !== o.id);
		for (const b of boxes) { const [source, metric] = b.dataset.kpi.split(':'); db.kpis.push({ org: o.id, source, metric, position: METRICS.findIndex((m) => m.source === source && m.metric === metric), target: tv(b) === '' ? null : Number(tv(b)) }); }
		invalidate(o.id); toast(`Saved ${boxes.length} KPIs`); return render();
	}
});

// Pipeline drag and drop (desktop)
app.addEventListener('dragstart', (e) => { const li = e.target.closest?.('[data-drag]'); if (li) { S.dragging = li.dataset.drag; e.dataTransfer.effectAllowed = 'move'; } });
app.addEventListener('dragover', (e) => { const col = e.target.closest?.('[data-drop]'); if (col && S.dragging) { e.preventDefault(); app.querySelectorAll('.col.drop').forEach((c) => c !== col && c.classList.remove('drop')); col.classList.add('drop'); } });
app.addEventListener('drop', (e) => {
	const col = e.target.closest?.('[data-drop]'); if (!col || !S.dragging) return; e.preventDefault();
	const l = db.leads.find((x) => x.id === S.dragging); S.dragging = null;
	if (!canEditLead(l)) { toast('Only the assigned rep or an admin can move this lead'); return render(); }
	if (l.stage !== col.dataset.drop) { l.stage = col.dataset.drop; l.changed = iso(new Date()); invalidate(l.org); toast(`Moved to ${STAGES.find((s) => s[0] === l.stage)[1]}`); }
	render();
});
app.addEventListener('dragend', () => { S.dragging = null; app.querySelectorAll('.col.drop').forEach((c) => c.classList.remove('drop')); });

// Chart hover: crosshair + tooltip
app.addEventListener('pointermove', (e) => {
	const wrap = e.target.closest?.('[data-chart]'); if (!wrap) return;
	const c = charts[wrap.dataset.chart], svg = wrap.querySelector('svg'), rect = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
	const pl = c.kind === 'area' ? 44 : 0, pr = c.kind === 'area' ? 8 : 0, W = vb.width;
	const rel = ((e.clientX - rect.left) / rect.width) * W;
	const i = Math.max(0, Math.min(c.points.length - 1, Math.round(((rel - pl) / (W - pl - pr)) * (c.points.length - 1))));
	const x = pl + (i / (c.points.length - 1)) * (W - pl - pr);
	const cross = svg.querySelector('.cross'); cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('visibility', 'visible');
	let yPx = 0;
	if (c.kind === 'area') {
		const vals = c.points.map((p) => p.value), max = Math.max(...vals) * 1.08, pt = 12, pb = 26, y = pt + (1 - c.points[i].value / max) * (c.height - pt - pb);
		const dot = svg.querySelector('.dot'); dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('visibility', 'visible'); yPx = (y / c.height) * rect.height;
	}
	let tip = wrap.querySelector('.tip'); if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; wrap.append(tip); }
	tip.style.left = `${(x / W) * 100}%`; tip.style.top = `${yPx}px`;
	tip.innerHTML = `${shortDate(c.points[i].day)} · <strong>${fmt(c.points[i].value, c.format)}</strong>`;
});
app.addEventListener('pointerout', (e) => { const wrap = e.target.closest?.('[data-chart]'); if (wrap && !wrap.contains(e.relatedTarget)) { wrap.querySelector('.tip')?.remove(); wrap.querySelector('.cross')?.setAttribute('visibility', 'hidden'); wrap.querySelector('.dot')?.setAttribute('visibility', 'hidden'); } });

render();
</script>
